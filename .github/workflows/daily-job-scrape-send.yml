name: Daily Job Scrape and Send

# Runs AFTER the existing "Manual Bulk Mail Sender" workflow finishes, scrapes
# fresh DevOps/Cloud job leads with genuine HR emails, then emails the resume.
# Can also be triggered manually (with a dry-run option) from the Actions tab.
on:
  workflow_run:
    workflows: ["Manual Bulk Mail Sender"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_count:
        description: "How many fresh leads to collect (5 providers x 5 = 25)"
        default: "25"
      per_provider:
        description: "Max unique leads per provider"
        default: "5"
      max_searches:
        description: "Searches per provider to spend"
        default: "20"
      max_send:
        description: "Max emails to send this run"
        default: "20"
      days:
        description: "Only keep posts from the last N days"
        default: "5"
      dry_run:
        description: "Preview only — collect leads but send no email"
        type: boolean
        default: false

# Don't let two runs commit the dedupe state at once.
concurrency:
  group: job-scrape-send
  cancel-in-progress: false

permissions:
  contents: write          # needed to commit state.json (dedupe) back to the repo

jobs:
  scrape-and-send:
    name: Scrape leads and send resume
    runs-on: ubuntu-latest
    # Only run when the upstream workflow succeeded, or on manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    defaults:
      run:
        working-directory: job_lead_analyzer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: job_lead_analyzer/requirements.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect fresh job leads
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPER_KEY: ${{ secrets.SERPER_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGDOG_KEY: ${{ secrets.SCRAPINGDOG_KEY }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
        run: |
          python collector.py \
            --target-count "${{ github.event.inputs.target_count || '25' }}" \
            --max-searches "${{ github.event.inputs.max_searches || '6' }}" \
            --per-provider "${{ github.event.inputs.per_provider || '5' }}" \
            --days "${{ github.event.inputs.days || '4' }}"

      - name: Upload leads JSON
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-leads
          path: job_lead_analyzer/daily_job_leads.json
          if-no-files-found: warn

      - name: Send resume to leads
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python send_resume.py --max-send "${{ github.event.inputs.max_send || '10' }}"

      - name: Preview recipients (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: python send_resume.py --dry-run

      - name: Persist dedupe state (so tomorrow's emails are new)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f job_lead_analyzer/state.json
          if git diff --cached --quiet; then
            echo "No dedupe-state change to commit."
          else
            git commit -m "chore: update job-lead dedupe state [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
