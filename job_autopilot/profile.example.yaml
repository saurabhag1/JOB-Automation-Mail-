# Your details. `python -m autopilot init` copies this to profile.yaml and fills
# what it can read from your resume. Complete the blanks once - the bot types
# these into real applications, so every value must be true.

name: ""
first_name: ""
last_name: ""
email: ""
phone: ""                 # with country code, e.g. +91 9876543210
city: ""
state: ""
country: India
linkedin: ""
github: ""
portfolio: ""

current_title: ""
current_company: ""
years_experience: 3
notice_period: ""         # e.g. Immediate, 15 days, 30 days
notice_period_days:       # the same as a number, for numeric form fields
current_ctc: ""           # e.g. 8 LPA
expected_ctc: ""          # e.g. 12 LPA
expected_salary_usd: ""   # annual, for remote / international roles, e.g. 30000

willing_to_relocate: true
